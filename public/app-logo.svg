<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Nifty Retail">
  <!-- Vibrant gradient background for visibility at all sizes -->
  <rect width="64" height="64" rx="14" fill="url(#nr-bg-grad)"/>

  <!-- Shopping bag body -->
  <path d="M16 24h32l-3 24a3 3 0 0 1-3 2.8H22a3 3 0 0 1-3-2.8L16 24z" fill="rgba(255,255,255,0.15)"/>
  <path d="M16 24h32l-3 24a3 3 0 0 1-3 2.8H22a3 3 0 0 1-3-2.8L16 24z" stroke="rgba(255,255,255,0.9)" stroke-width="2.2" fill="none" stroke-linejoin="round"/>

  <!-- Bag handles -->
  <path d="M24 24v-6a8 8 0 0 1 16 0v6" stroke="rgba(255,255,255,0.85)" stroke-width="2.4" stroke-linecap="round" fill="none"/>

  <!-- Lightning bolt — represents speed/nifty -->
  <path d="M27 29h5l-3 8h5l-7 11 2-7h-5l3-12z" fill="#ffed00"/>

  <!-- Accent dot — scanner indicator -->
  <circle cx="40" cy="35" r="2.8" fill="rgba(255,255,255,0.9)"/>

  <defs>
    <!-- Background gradient: deep magenta to rich purple-blue -->
    <linearGradient id="nr-bg-grad" x1="0" y1="64" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9b0d5e"/>
      <stop offset="0.45" stop-color="#c2117a"/>
      <stop offset="1" stop-color="#1a6fa0"/>
    </linearGradient>
  </defs>
</svg>